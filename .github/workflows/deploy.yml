name: Deploy production

# Production (https://ai.datapainters.com, moving to www.datapainters.com) is
# deployed by hand, never on merge: run this workflow from the Actions tab,
# choosing the commit already tested on the development site. Its API image
# is reused rather than rebuilt, so production runs exactly what was tested.

on:
  workflow_dispatch:
    inputs:
      replace_api_service:
        description: >-
          Force-replace the API service. Needed when a change AWS cannot make
          in place (notably moving between public and private subnets) leaves
          apply failing with InvalidParameterException.
        type: boolean
        default: false
      snapshot_database:
        description: >-
          Take a manual database snapshot before applying. Use when the
          release changes data in a way that cannot be undone.
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: ./.github/workflows/deploy-env.yml
    with:
      environment: prod
      github_environment: production
      site_env: production
      replace_api_service: ${{ inputs.replace_api_service }}
      snapshot_database: ${{ inputs.snapshot_database }}
    secrets: inherit
