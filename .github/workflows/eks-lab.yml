name: EKS lab

# Manual on/off switch for the demo Kubernetes cluster.
#
# The cluster is not part of the normal deploy because it bills ~$73/month for
# the control plane whether or not anything runs on it. Turn it up the morning
# of a demo, turn it down afterwards.

on:
  workflow_dispatch:
    inputs:
      action:
        description: What to do with the lab cluster
        required: true
        type: choice
        options:
          - up
          - down

concurrency:
  group: eks-lab
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-2
  TF_VERSION: 1.14.3

jobs:
  lab:
    name: ${{ inputs.action == 'up' && 'Start' || 'Stop' }} lab cluster
    runs-on: ubuntu-latest
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE }}
          aws-region: ${{ env.AWS_REGION }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Init
        working-directory: infra/envs/prod
        run: |
          terraform init -input=false \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="dynamodb_table=${{ vars.TF_STATE_LOCK_TABLE }}"

      # Current image is read from state so that toggling the lab never
      # accidentally rolls the API back to the tfvars placeholder.
      - name: Resolve current API image
        id: current
        working-directory: infra/envs/prod
        run: |
          image=$(terraform state show 'module.api.aws_ecs_express_gateway_service.api' 2>/dev/null \
            | grep -oP 'image\s+=\s+"\K[^"]+' | head -1 || true)
          if [ -z "$image" ]; then
            echo "::warning::Could not read the deployed image from state; using tfvars default."
            echo "arg=" >> "$GITHUB_OUTPUT"
          else
            echo "arg=-var=api_image=$image" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply
        working-directory: infra/envs/prod
        run: |
          terraform apply -input=false -auto-approve \
            -var="enable_eks_lab=${{ inputs.action == 'up' }}" \
            ${{ steps.current.outputs.arg }}

      - name: Report
        working-directory: infra/envs/prod
        run: |
          {
            echo "### EKS lab: ${{ inputs.action }}"
            echo ""
            if [ "${{ inputs.action }}" = "up" ]; then
              echo '```'
              terraform output -raw eks_lab_kubeconfig_command
              echo ''
              echo '```'
              echo ""
              echo "Remember to run this workflow with \`down\` when you are finished."
            else
              echo "Cluster destroyed. Control plane billing has stopped."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
